<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock System - Data Restore Helper</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 40px auto; background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 28px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { line-height: 1.6; }
  .ok { color: #34d399; font-weight: 700; }
  .err { color: #f87171; font-weight: 700; }
  a { color: #818cf8; }
  .btn { display: inline-block; margin-top: 14px; background: #6366f1; color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h1>Data Restore Helper</h1>
  <div id="status">Checking local storage on this address...</div>
</div>
<script type="module">
  import { getAllItems, getAllTransactions, getAllVendors, importDatabaseJSON } from '/src/db.js';

  const statusEl = document.getElementById('status');
  const show = html => { statusEl.innerHTML = html; };

  const summarize = (items, transactions, vendors) =>
    `<p>Currently stored here:<br>Items: <b>${items.length}</b><br>Transactions: <b>${transactions.length}</b><br>Vendors: <b>${vendors.length}</b></p>`;

  async function main() {
    try {
      const [items, transactions, vendors] = await Promise.all([
        getAllItems(),
        getAllTransactions(),
        getAllVendors(),
      ]);

      if (items.length || transactions.length || vendors.length) {
        show(
          `<p class="ok">Data already exists on this address.</p>` +
          summarize(items, transactions, vendors) +
          `<p>Nothing was changed. You can use the app here:</p>` +
          `<a class="btn" href="/">Open the app</a>`
        );
        return;
      }

      show(`<p>This browser address is empty. Restoring from backup...</p>`);

      try {
        const res = await fetch('/mobile-shop-phone-backup-2026-09-22.json');
        if (!res.ok) throw new Error(`backup file not reachable (HTTP ${res.status})`);
        const json = await res.text();
        await importDatabaseJSON(json);

        const [rItems, rTransactions, rVendors] = await Promise.all([
          getAllItems(),
          getAllTransactions(),
          getAllVendors(),
        ]);

        show(
          `<p class="ok">Restored successfully on this browser address.</p>` +
          summarize(rItems, rTransactions, rVendors) +
          `<a class="btn" href="/">Open the app now</a>`
        );
      } catch (err) {
        show(`<p class="err">Restore failed: ${err.message}</p>`);
      }
    } catch (err) {
      show(`<p class="err">Could not read local storage: ${err.message}</p>`);
    }
  }

  main();
</script>
</body>
</html>
